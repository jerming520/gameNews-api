<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>FastAPI Test</title>
  </head>
  <body>
    <input id="name" type="text" placeholder="請輸入姓名" />
    <input id="content" type="text" placeholder="請輸入留言內容" />
    <button id="sendBtn">送出留言</button>
    <button id="getBtn">取得留言</button>
    <div id="messageList"></div>
    <script>
      const sendBtn = document.getElementById("sendBtn");
      const nameInput = document.getElementById("name");
      const contentInput = document.getElementById("content");
      const getBtn = document.getElementById("getBtn");
      const messageList = document.getElementById("messageList");
      sendBtn.addEventListener("click", () => {
        const name = nameInput.value;
        const content = contentInput.value;
        console.log(name);
        console.log(content);
        //
        fetch("http://127.0.0.1:8000/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            name: name,
            content: content,
          }),
        })
          .then((response) => response.json())
          .then((data) => {
            console.log(data);
          });
      });
      getBtn.addEventListener("click", () => {
        console.log("取得留言按鈕被點擊");
        fetch("http://127.0.0.1:8000/messages")
          .then((response) => response.json())
          .then((data) => {
            console.log(data);
            messageList.textContent = data.data[0][1] + "：" + data.data[0][2];
          });
      });
    </script>
  </body>
</html>
